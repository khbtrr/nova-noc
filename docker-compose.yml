services:
  postgres:
    image: postgres:16-alpine
    container_name: nova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nova_secret}
      POSTGRES_DB: ${POSTGRES_DB:-nova_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nova} -d ${POSTGRES_DB:-nova_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nova-net

  influxdb:
    image: influxdb:2.7-alpine
    container_name: nova-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:-nova_influx_secret}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-nova-org}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-nova-metrics}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-nova-influxdb-admin-token}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
    volumes:
      - influxdata:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nova-net

  nova-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nova-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nova}:${POSTGRES_PASSWORD:-nova_secret}@postgres:5432/${POSTGRES_DB:-nova_db}
      INFLUXDB_URL: http://influxdb:8086
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
      - "${SYSLOG_UDP_PORT:-5140}:5140/udp"
      - "${NETFLOW_UDP_PORT:-2055}:2055/udp"
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    networks:
      - nova-net

  nova-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: nova-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - nova-backend
    networks:
      - nova-net

volumes:
  pgdata:
    driver: local
  influxdata:
    driver: local

networks:
  nova-net:
    driver: bridge
