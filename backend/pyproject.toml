[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-backend"
version = "0.1.0"
description = "NOVA NOC Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "influxdb-client",
    "librouteros",
    "pysnmp",
    "apscheduler>=3.10",
    "pyjwt",
    "bcrypt",
    "pydantic-settings",
    "google-generativeai",
    "python-telegram-bot",
    "websockets",
    "httpx"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio"
]
